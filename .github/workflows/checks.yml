name: Checks

on:
  pull_request:
    types: [ opened, synchronize, reopened ]
  push:
    branches: [ master, develop ]

jobs:
  wrapper-validation:
    name: "Gradle Wrapper Validation"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: gradle/actions/wrapper-validation@v5

  static-analysis:
    name: "Static Code Analysis"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*') }}-${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties') }}
      - name: Configure parallel build
        run: echo "org.gradle.parallel=true" >> local.properties
      - name: XML code style
        run: |
          curl -s -L https://github.com/ByteHamster/android-xml-formatter/releases/download/1.1.0/android-xml-formatter.jar > android-xml-formatter.jar
          find . -wholename "*/res/layout/*.xml" | xargs java -jar android-xml-formatter.jar
          test $(git diff | wc -l) -eq 0 || (echo -e "\n\n===== Found XML code style violations! See output below how to fix them. =====\n\n" && git --no-pager diff --color=always && false)
      - name: Checkstyle, Lint, SpotBugs
        run: ./gradlew checkstyle lint
      - name: Generate readable error messages for GitHub
        if: failure()
        run: |
          python .github/workflows/errorPrinter.py
          git diff --name-only | xargs -I '{}' echo "::error file={},line=1,endLine=1,title=XML Format::Run android-xml-formatter.jar on this file or view CI output to see how it should be formatted."
          false

  unit-test:
    name: "Unit Test: ${{ matrix.variant }}"
    needs: static-analysis
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      matrix:
        include:
          - variant: "PlayDebug"
            base-variant: "Debug"
            execute-tests: true
            upload-artifact: true
          - variant: "PlayRelease"
            base-variant: "Release"
            execute-tests: true
            upload-artifact: false
          - variant: "FreeRelease"
            base-variant: "Release"
            execute-tests: false
            upload-artifact: false
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*') }}-${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties') }}
      - name: Configure parallel build
        run: echo "org.gradle.parallel=true" >> local.properties
      - name: Create temporary release keystore
        run: |
          keytool -noprompt -genkey -v -keystore "app/keystore" -alias alias -storepass password -keypass password -keyalg RSA -validity 10 -dname "CN=antennapod.org, OU=dummy, O=dummy, L=dummy, S=dummy, C=US"
          cp app/keystore app-wearos/keystore
      - name: Restore personal debug keystore
        if: matrix.upload-artifact == true
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "Secret DEBUG_KEYSTORE_BASE64 is missing"
            exit 1
          fi
          mkdir -p ~/.android
          echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
          keytool -list -v -keystore ~/.android/debug.keystore -storepass android | grep "SHA256: C9:31:19:3D:7D:7B:BE:E3:80:AB:61:6A:A7:68:C8:12:56:BD:AE:FC:C5:44:19:FB:91:B3:8D:2A:F8:3A:93:13"
          cp ~/.android/debug.keystore "$RUNNER_TEMP/personal-debug.keystore"
          echo "PERSONAL_DEBUG_KEYSTORE=$RUNNER_TEMP/personal-debug.keystore" >> "$GITHUB_ENV"
      - name: Build
        run: ./gradlew assemble${{ matrix.variant }}
      - name: Verify APK signing key
        if: matrix.upload-artifact == true
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          DIGEST=$("$APKSIGNER" verify --print-certs app/build/outputs/apk/play/debug/app-play-debug.apk | grep -m1 "certificate SHA-256 digest" | awk '{print $NF}')
          echo "::notice title=APK signing key::SHA-256 $DIGEST"
          if [ "$DIGEST" != "c931193d7d7bbee380ab616aa768c81256bdaefcc54419fb91b38d2af83a9313" ]; then
            echo "::error title=APK signing key::APK is not signed with the permanent personal key"
            exit 1
          fi
      - name: Test
        if: matrix.execute-tests == true
        run: ./gradlew test${{ matrix.variant }}UnitTest test${{ matrix.base-variant }}UnitTest
      - uses: actions/upload-artifact@v4
        if: matrix.upload-artifact == true
        with:
          name: app-play-debug.apk
          path: app/build/outputs/apk/play/debug/app-play-debug.apk

  emulator-test:
    name: "Emulator Test API ${{ matrix.version.api-level }}"
    needs: static-analysis
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      matrix:
        version:
          - api-level: 23
            target: default
          - api-level: 30
            target: aosp_atd
          - api-level: 36
            target: aosp_atd
    steps:
      - name: Remove unused packages to save space
        run: sudo apt-get remove firefox google-chrome-stable microsoft-edge-stable snapd powershell azure-cli llvm-16 llvm-17 llvm-18 llvm-16-dev llvm-17-dev llvm-18-dev
      - uses: actions/checkout@v5
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*') }}-${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties') }}
      - name: Configure parallel build
        run: echo "org.gradle.parallel=true" >> local.properties
      - name: Build with Gradle
        run: ./gradlew assemblePlayDebugAndroidTest
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android Emulator test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.version.api-level }}
          target: ${{ matrix.version.target }}
          arch: x86_64
          channel: canary
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash .github/workflows/runEmulatorTests.sh
      - name: Report failed tests
        if: failure()
        run: |
          for f in $(find app/build/outputs/androidTest-results -name '*.xml'); do
            python3 -I - "$f" <<'EOF'
          import sys, xml.etree.ElementTree as ET
          for case in ET.parse(sys.argv[1]).iter('testcase'):
              for problem in list(case.findall('failure')) + list(case.findall('error')):
                  text = (problem.get('message') or problem.text or '').strip().replace('\n', '%0A')[:1500]
                  print('::error title=' + case.get('classname', '') + '.' + case.get('name', '') + '::' + text)
          EOF
          done
          grep -A15 "FATAL EXCEPTION" app/build/reports/androidTests/logcat.txt | head -40 | sed 's/^/::warning title=Crash in logcat::/' || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-report
          path: app/build/reports/androidTests/

  upgrade-test:
    name: "Upgrade test: previous build to this build"
    needs: unit-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Download this build's APK
        uses: actions/download-artifact@v4
        with:
          name: app-play-debug.apk
          path: new
      - name: Download previous build's APK
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          AAPT2="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/aapt2"
          THIS_PKG=$("$AAPT2" dump packagename new/app-play-debug.apk)
          for RUN in $(gh run list --repo "$GITHUB_REPOSITORY" --workflow checks.yml --branch personal --limit 30 --json databaseId --jq '.[].databaseId'); do
            rm -rf old
            if [ "$RUN" != "$GITHUB_RUN_ID" ] && gh run download "$RUN" --repo "$GITHUB_REPOSITORY" -n app-play-debug.apk -D old \
                && [ "$("$AAPT2" dump packagename old/app-play-debug.apk)" = "$THIS_PKG" ]; then
              echo "::notice title=Upgrade test::Previous build: https://github.com/$GITHUB_REPOSITORY/actions/runs/$RUN"
              echo "found=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "::notice title=Upgrade test::No previous build of $THIS_PKG yet, nothing to compare against"
          echo "found=false" >> "$GITHUB_OUTPUT"
      - name: Compare signing keys
        if: steps.previous.outputs.found == 'true'
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          OLD=$("$APKSIGNER" verify --print-certs old/app-play-debug.apk | grep -m1 "certificate SHA-256 digest" | awk '{print $NF}')
          NEW=$("$APKSIGNER" verify --print-certs new/app-play-debug.apk | grep -m1 "certificate SHA-256 digest" | awk '{print $NF}')
          echo "::notice title=Signing keys::previous build $OLD / this build $NEW"
          test "$OLD" = "$NEW"
      - name: Enable KVM group perms
        if: steps.previous.outputs.found == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install previous build, then update to this build
        if: steps.previous.outputs.found == 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: aosp_atd
          arch: x86_64
          channel: canary
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash .github/workflows/personalUpgradeTest.sh

  migration-test:
    name: "Migration test API ${{ matrix.api-level }}: AntennaPod Debug to AntennaPod Personal"
    needs: unit-test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        api-level: [ 34, 36 ]
    steps:
      - uses: actions/checkout@v5
      - name: Download this build's APK
        uses: actions/download-artifact@v4
        with:
          name: app-play-debug.apk
          path: new
      - name: Download an AntennaPod Debug APK signed with a different key
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 39549751288 --repo "$GITHUB_REPOSITORY" -n app-play-debug.apk -D old
      - name: Install sqlite3
        run: sudo apt-get install -y sqlite3
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Migrate with the USB script
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: aosp_atd
          arch: x86_64
          channel: canary
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash .github/workflows/personalMigrationTest.sh
      - name: Report results
        if: always()
        run: |
          [ -f migration-results.txt ] && echo "::notice title=Migration test results::$(sed ':a;N;$!ba;s/\n/%0A/g' migration-results.txt)"
          [ -f migrate-output.txt ] && echo "::notice title=Migration script output::$(tail -n 60 migrate-output.txt | tr -d '\r' | sed ':a;N;$!ba;s/\n/%0A/g')"
          true

  ci-summary:
    name: "CI Summary"
    needs:
      - wrapper-validation
      - emulator-test
      - unit-test
    runs-on: ubuntu-latest
    steps:
      - run: echo "All checks passed"
